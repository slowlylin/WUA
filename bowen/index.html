<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博聞館｜文學典藏</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f5f0e8;--paper2:#ede8e0;--ink:#2a2218;--muted:#796e60;--red:#b32e2e;--border:#c8b89a;--reader:#f2e6c9;--readink:#352c20;--size:20px;--leading:2}*{box-sizing:border-box}body{margin:0;background:#e8e0d0;color:var(--ink);font-family:'Noto Serif TC',serif}button,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{background:var(--paper);border-bottom:2px solid var(--red)}.topin{max-width:1000px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:28px;font-weight:700;letter-spacing:.18em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:5px}.seal{border:3px double var(--red);color:var(--red);width:67px;height:67px;border-radius:50%;display:grid;place-content:center;text-align:center;font-size:12px;line-height:1.4;font-weight:bold;transform:rotate(-8deg)}.nav{background:var(--paper2);border-bottom:1px solid var(--border)}.navin{max-width:1000px;margin:auto;display:flex;gap:25px;padding:13px 24px;font-size:13px}.nav a:hover{color:var(--red)}main{max-width:1000px;margin:35px auto;padding:0 24px 60px}.kicker{color:var(--red);font-size:11px;letter-spacing:.16em;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px}.intro{color:var(--muted);font-size:14px;line-height:2;margin-bottom:28px}.book{margin-bottom:20px;display:grid;grid-template-columns:210px 1fr;gap:28px;background:#fdfaf5;border:1px solid var(--border);border-radius:8px;padding:24px}.book-chapters{display:none;grid-column:1/-1;border-top:1px solid var(--border);padding-top:18px;margin-top:4px}.book-chapters.open{display:block}.cover{width:100%;border-radius:3px;box-shadow:4px 9px 25px #34251d30}.id{font:12px monospace;color:var(--muted)}h1{font-size:27px;line-height:1.5;margin:12px 0}.meta{color:var(--red);font-size:12px}.summary{font-size:14px;line-height:2;color:#55483b;margin:20px 0;white-space:pre-wrap}.summary p{margin:0 0 1em}.summary p:last-child{margin-bottom:0}.btn{background:var(--red);border:1px solid var(--red);color:white;border-radius:4px;padding:10px 19px;font-size:13px}.btn.secondary{background:transparent;color:var(--red)}.section{margin-top:35px}.chapter{width:100%;border:1px solid var(--border);background:#fdfaf5;padding:17px;text-align:left;display:flex;gap:15px;align-items:center;margin-bottom:8px;border-radius:5px}.chapter:disabled{cursor:default;opacity:.65}.chapter strong{font-size:14px}.chapter small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.num{color:var(--red);font:12px monospace}.footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--muted);font-size:11px}.reader{display:none;min-height:100vh;background:var(--reader);color:var(--readink)}body.reading .public{display:none}body.reading .reader{display:block}.readtop #readBook{font-size:19px;font-weight:700;line-height:1.5;text-align:center}.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{line-height:1.55;margin:1.3em 0 .65em;font-weight:700}.prose h1{font-size:1.55em}.prose h2{font-size:1.35em}.prose h3{font-size:1.2em}.prose h4{font-size:1.1em}.readtop{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #9c8d7950;gap:12px;font-size:13px}.readmain{max-width:760px;margin:auto;padding:65px 26px 110px}.readmain h2{text-align:center;font-size:25px;line-height:1.7;margin:15px 0 60px}.readlabel{text-align:center;color:#a36a5c;font:12px monospace;letter-spacing:.15em}.prose{font-size:var(--size);line-height:var(--leading);white-space:pre-wrap;overflow-wrap:anywhere}.prose p{margin:0 0 1.5em}.empty{text-align:center;color:#928578;font-size:14px;border:1px dashed #a9978277;padding:25px}.readnav{display:flex;justify-content:space-between;margin-top:65px;gap:10px}.readnav button{padding:10px 15px;background:transparent;border:1px solid #9c8d7980;border-radius:5px;color:inherit}.readnav button:disabled{opacity:.25}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools select,.tools button{padding:6px 9px;background:transparent;color:inherit;border:1px solid #9c8d7980;border-radius:5px;font-size:12px}#settings{display:none;position:fixed;right:18px;top:65px;background:var(--reader);border:1px solid #9c8d7980;padding:18px;border-radius:8px;box-shadow:0 12px 25px #0003;z-index:10;font-size:13px}#settings.show{display:grid;gap:12px}#settings label{display:flex;gap:12px;align-items:center;justify-content:space-between}@media(max-width:620px){.book{grid-template-columns:1fr}.cover{max-width:195px}.topin{padding:18px}.brand{font-size:23px}.readtop{padding:12px;flex-wrap:wrap}.readmain{padding:45px 20px 80px}h1{font-size:23px}}
</style></head><body><div class="public"><header class="top"><div class="topin"><div class="brand">博聞館<small>BO WEN ARCHIVE · 文學典藏</small></div><div class="seal">博聞<br>館藏</div></div></header><nav class="nav"><div class="navin"><a href="../">世界觀更新管理局</a><a href="#collection">館藏目錄</a></div></nav><main><div class="kicker">COLLECTION REGISTER · 館藏目錄</div><p class="intro">本館收錄各類文學作品及特殊世界紀事。館藏內容依作品原貌呈現，不代表本館對相關物理現象提供保證。</p><div id="books"></div></main><footer class="footer">博聞館 · 文學典藏　｜　世界觀更新管理局</footer></div><div class="reader"><div class="readtop"><button onclick="closeReader()" style="background:none;border:0;color:inherit;cursor:pointer">← 返回館藏</button><span id="readBook"></span><div class="tools"><button onclick="toggleSettings()">Aa 閱讀設定</button></div></div><div id="settings"><label>字體大小 <input id="size" type="range" min="16" max="30" value="20" oninput="setReading()"></label><label>行距 <select id="leading" onchange="setReading()"><option value="1.7">緊湊</option><option value="2" selected>舒適</option><option value="2.3">寬鬆</option></select></label><label>閱讀主題 <select id="theme" onchange="setReading()"><option value="beige" selected>柔米黃</option><option value="oat">燕麥奶</option><option value="parchment">舊書紙</option><option value="sage">霧鼠尾草</option><option value="rose">煙粉</option><option value="gray">暖霧灰</option><option value="paper">原版暖紙</option><option value="black">原版純黑</option><option value="purple">原版深紫</option></select></label></div><article class="readmain"><div class="readlabel" id="readNumber"></div><h2 id="readTitle"></h2><div class="prose" id="prose"></div><div class="readnav"><button id="prev" onclick="move(-1)">← 上一章</button><button id="next" onclick="move(1)">下一章 →</button></div></article></div><script src="books.js"></script><script>
const books=(window.BOWEN_BOOKS||[]);let bookIndex=0,chapterIndex=0;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function formatProse(source){
  // A shared, HTML-escaped Markdown subset for fiction chapters.
  const inline = value => esc(value)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  const lines = String(source||'').replace(/\r\n?/g,'\n').split('\n');
  const output=[];
  let paragraph=[];
  const flush=()=>{if(paragraph.length){output.push('<p>'+inline(paragraph.join('\n'))+'</p>');paragraph=[];}};
  for(const line of lines){
    if(!line.trim()){flush();continue;}
    const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*$/);
    if(heading){
      flush();
      const level=heading[1].length;
      output.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>');
    }else{paragraph.push(line);}
  }
  flush();
  return output.join('');
}
function published(b){return (b.chapters||[]).map((c,i)=>({...c,index:i})).filter(c=>c.published&&c.body?.trim())}function render(){
  $('books').innerHTML=books.map((b,i)=>`<div class="book" id="book-${i}">
    <img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)} 封面">
    <div><div class="id">${esc(b.id)} · 館藏作品</div><h1>${esc(b.title)}</h1>
      <div class="meta">${esc(b.genre)}　｜　${esc(b.status)}</div>
      <div class="summary">${formatProse(b.summary)}</div>
      <button class="btn" id="chapter-toggle-${i}" aria-expanded="false" aria-controls="book-chapters-${i}" onclick="toggleChapters(${i})">查閱章節目錄</button>
    </div>
    <div class="book-chapters" id="book-chapters-${i}">
      <div class="kicker">CHAPTER INDEX · ${esc(b.title)}章節目錄</div>
      ${(b.chapters||[]).map((c,j)=>`<button class="chapter" ${!c.published||!c.body?.trim()?'disabled':''} onclick="openReader(${i},${j})"><span class="num">${String(j+1).padStart(2,'0')}</span><span><strong>${esc(c.title)}</strong><small>${c.published&&c.body?.trim()?'開放閱讀':'原稿尚未發布'}</small></span></button>`).join('')||'<p class="intro">尚未建立章節</p>'}
    </div>
  </div>`).join('');
}
function toggleChapters(i){
  const panel=$('book-chapters-'+i),button=$('chapter-toggle-'+i);
  const opening=!panel.classList.contains('open');
  panel.classList.toggle('open',opening);
  button.setAttribute('aria-expanded',String(opening));
  button.textContent=opening?'收合章節目錄':'查閱章節目錄';
}
function openReader(i,j){const c=books[i]?.chapters?.[j];if(!c?.published||!c.body?.trim())return;bookIndex=i;chapterIndex=j;document.body.classList.add('reading');$('settings').classList.remove('show');$('readBook').textContent=books[i].title;$('readNumber').textContent='CHAPTER '+String(j+1).padStart(2,'0');$('readTitle').textContent=c.title;$('prose').innerHTML=formatProse(c.body);const ids=published(books[i]).map(x=>x.index),pos=ids.indexOf(j);$('prev').disabled=pos<=0;$('next').disabled=pos>=ids.length-1;localStorage.setItem('bowen-progress',JSON.stringify({book:i,chapter:j}));window.scrollTo(0,0)}function move(d){const ids=published(books[bookIndex]).map(x=>x.index);let k=ids.indexOf(chapterIndex)+d;if(k>=0&&k<ids.length)openReader(bookIndex,ids[k])}function closeReader(){document.body.classList.remove('reading');window.scrollTo(0,0)}function toggleSettings(){$('settings').classList.toggle('show')}function setReading(){let size=$('size').value,leading=$('leading').value,theme=$('theme').value;document.documentElement.style.setProperty('--size',size+'px');document.documentElement.style.setProperty('--leading',leading);let themes={beige:['#f2e6c9','#352c20'],oat:['#eae0d1','#342e28'],parchment:['#e8d9b9','#392d21'],sage:['#e0e7da','#303a31'],rose:['#eadbd7','#3b302f'],gray:['#e3e0d9','#34312e'],paper:['#fdfaf5','#2a2218'],black:['#080808','#eee'],purple:['#1a1226','#f4eaf6']};document.documentElement.style.setProperty('--reader',themes[theme][0]);document.documentElement.style.setProperty('--readink',themes[theme][1]);localStorage.setItem('bowen-reading',JSON.stringify({size,leading,theme}))}try{let s=JSON.parse(localStorage.getItem('bowen-reading'));if(s){$('size').value=s.size;$('leading').value=s.leading;$('theme').value=s.theme;setReading()}}catch(e){}render();
</script></body></html>
