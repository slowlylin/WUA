<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博聞館｜館藏編輯器</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet"><style>:root{--red:#b32e2e;--line:#c8b89a;--cream:#f5f0e8;--ink:#2a2218}*{box-sizing:border-box}body{margin:0;background:#e8e0d0;color:var(--ink);font-family:'Noto Serif TC',serif}.wrap{max-width:1100px;margin:auto;padding:24px}header{border-bottom:2px solid var(--red);padding-bottom:15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:23px;margin:0}small,.muted{color:#746c62}main{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}h2{font-size:15px;color:var(--red);margin:0 0 14px}label{display:block;font-size:12px;color:#655b51;margin:12px 0 4px}input,textarea,select{font:inherit;width:100%;background:#fdfaf5;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px;font-size:13px}textarea{min-height:300px;line-height:1.8;resize:vertical}button{font:inherit;cursor:pointer;border:1px solid var(--red);background:var(--red);color:white;padding:9px 12px;border-radius:4px;font-size:12px}button.secondary{background:transparent;color:var(--red)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.chapter{display:block;width:100%;text-align:left;background:#fdfaf5;color:var(--ink);border:1px solid var(--line);margin:6px 0;padding:10px}.chapter.active{border-color:var(--red);background:#f7e8e4}.preview{background:#fdfaf5;border:1px solid var(--line);padding:22px;white-space:pre-wrap;line-height:2;font-size:16px;min-height:110px}.notice{font-size:12px;line-height:1.9;color:#716459}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto}.hidden{display:none}@media(max-width:750px){main{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><header><div><h1>博聞館｜館藏編輯器</h1><small>COLLECTION EDITOR · 本機編輯與匯出</small></div><a href="index.html" style="color:var(--red);font-size:12px">返回博聞館</a></header><div class="panel notice">使用方式：先匯入既有 <strong>books.js</strong>（或使用初始資料），選擇作品，新增章節並貼上正文。完成後按「下載 books.js」，再將新檔案上傳至網站的 <strong>bowen</strong> 資料夾，覆蓋舊檔。編輯器不會直接修改線上網站。建議每次編輯前先匯入最新版本，避免覆蓋其他更新。<br><strong>注意：</strong>公開網站上的編輯器不具備登入保護；其他人即使能使用這個頁面，也無法直接修改妳的 GitHub 儲存庫。</div><main><div><div class="panel"><h2>資料庫管理</h2><label>匯入既有 books.js</label><input type="file" id="import" accept=".js,.json,.txt"><div class="buttons"><button onclick="download()">下載 books.js</button><button class="secondary" onclick="backup()">備份 JSON</button></div><p class="notice" id="message">已載入初始館藏。</p></div><div class="panel"><h2>作品目錄</h2><div id="booklist"></div><div class="buttons"><button class="secondary" onclick="addBook()">＋ 新增作品</button></div></div><div class="panel"><h2>章節清單</h2><div id="chapterlist"></div><div class="buttons"><button class="secondary" onclick="addChapter()">＋ 新增章節</button><button class="secondary" onclick="shift(-1)">↑ 上移</button><button class="secondary" onclick="shift(1)">↓ 下移</button></div></div></div><div><div class="panel"><h2>作品資料</h2><label>館藏編號</label><input id="bid" oninput="saveBook()"><label>書名</label><input id="title" oninput="saveBook()"><label>作者／署名</label><input id="author" oninput="saveBook()"><label>類型</label><input id="genre" oninput="saveBook()"><label>連載狀態</label><input id="status" oninput="saveBook()"><label>封面檔案路徑</label><input id="cover" oninput="saveBook()"><label>作品簡介</label><textarea id="summary" style="min-height:95px" oninput="saveBook()"></textarea></div><div class="panel"><h2>章節編輯</h2><label>章節標題</label><input id="ctitle" oninput="saveChapter()"><label class="checkbox"><input type="checkbox" id="published" onchange="saveChapter()">已發布（讀者可見）</label><label>章節正文（直接貼上純文字；空行分段）</label><textarea id="body" oninput="saveChapter()" placeholder="在這裡貼上小說正文……"></textarea><div class="buttons"><button class="secondary" onclick="removeChapter()">刪除本章</button></div><label>即時預覽</label><div class="preview" id="preview"></div></div></div></main></div><script src="books.js"></script><script>
let books=structuredClone(window.BOWEN_BOOKS||[]),bi=0,ci=0;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let b=books[bi];$('booklist').innerHTML=books.map((x,i)=>`<button class="chapter ${bi===i?'active':''}" onclick="bi=${i};ci=0;render()">${esc(x.id)}　${esc(x.title)}</button>`).join('');$('chapterlist').innerHTML=(b?.chapters||[]).map((c,i)=>`<button class="chapter ${ci===i?'active':''}" onclick="ci=${i};render()">${i+1}. ${esc(c.title)} ${c.published?'✓':''}</button>`).join('');for(let k of ['id','title','author','genre','status','cover','summary']){$(k==='id'?'bid':k).value=b?.[k]||''}let c=b?.chapters?.[ci];$('ctitle').value=c?.title||'';$('body').value=c?.body||'';$('published').checked=!!c?.published;['ctitle','body','published'].forEach(k=>$(k).disabled=!c);$('preview').textContent=c?.body||'尚未填寫正文';}function saveBook(){let b=books[bi];if(!b)return;for(let k of ['id','title','author','genre','status','cover','summary'])b[k]=$(k==='id'?'bid':k).value;renderListsOnly()}function renderListsOnly(){$('booklist').innerHTML=books.map((x,i)=>`<button class="chapter ${bi===i?'active':''}" onclick="bi=${i};ci=0;render()">${esc(x.id)}　${esc(x.title)}</button>`).join('')}function saveChapter(){let c=books[bi]?.chapters?.[ci];if(!c)return;c.title=$('ctitle').value;c.body=$('body').value;c.published=$('published').checked;$('preview').textContent=c.body||'尚未填寫正文';$('chapterlist').children[ci].textContent=(ci+1)+'. '+c.title+(c.published?' ✓':'')}function addBook(){books.push({id:'BW-'+String(books.length+1).padStart(3,'0'),title:'新館藏',author:'',genre:'',status:'籌備中',cover:'',summary:'',chapters:[]});bi=books.length-1;ci=0;render()}function addChapter(){if(!books[bi])return;books[bi].chapters.push({title:'第'+(books[bi].chapters.length+1)+'章',body:'',published:false});ci=books[bi].chapters.length-1;render()}function removeChapter(){let arr=books[bi]?.chapters;if(!arr?.length)return;if(!confirm('確定刪除本章？請先備份資料。'))return;arr.splice(ci,1);ci=Math.max(0,Math.min(ci,arr.length-1));render()}function shift(d){let arr=books[bi]?.chapters;if(!arr?.length)return;let n=ci+d;if(n<0||n>=arr.length)return;[arr[ci],arr[n]]=[arr[n],arr[ci]];ci=n;render()}function downloadFile(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function download(){downloadFile('books.js','window.BOWEN_BOOKS = '+JSON.stringify(books,null,2)+';\n','text/javascript;charset=utf-8');$('message').textContent='已下載 books.js。請將檔案上傳至網站以發布。'}function backup(){downloadFile('bowen-backup.json',JSON.stringify(books,null,2),'application/json;charset=utf-8')}$('import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let s=await f.text();try{let a;if(f.name.endsWith('.json'))a=JSON.parse(s);else{let m=s.match(/(?:window\.)?BOWEN_BOOKS\s*=\s*([\s\S]*?);\s*$/);if(!m)throw Error('找不到 BOWEN_BOOKS');a=JSON.parse(m[1])}if(!Array.isArray(a))throw Error('格式不正確');books=a;bi=0;ci=0;render();$('message').textContent='已匯入 '+f.name+'，共 '+books.length+' 部作品。'}catch(err){$('message').textContent='匯入失敗：'+err.message}});render();
</script></body></html>
