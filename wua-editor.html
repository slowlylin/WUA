<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WUA 案例編輯器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f5f0e8;--cream-dark:#ede8e0;--border:#c8b89a;--red:#b32e2e;--ink:#2a2218;--ink-mid:#555;--ink-light:#888;--ink-faint:#aaa}
body{font-family:'Noto Serif TC',serif;background:#e8e0d0;color:var(--ink);min-height:100vh;padding:2rem 1rem}
.page-header{max-width:1050px;margin:0 auto 1.5rem;border-bottom:2px solid var(--red);padding-bottom:.75rem;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.page-header h1{font-size:17px;font-weight:700;letter-spacing:.04em}
.page-header .sub{font-size:11px;color:var(--ink-light)}
.layout{max-width:1050px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.panel{background:var(--cream);border:.5px solid var(--border);border-radius:10px;overflow:hidden}
.panel-header{background:var(--cream-dark);border-bottom:.5px solid var(--border);padding:.55rem 1rem;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-light);display:flex;align-items:center;justify-content:space-between}
.panel-body{padding:1rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:11px;color:var(--ink-light);margin-bottom:4px;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;background:#f5f0e8;border:.5px solid var(--border);border-radius:4px;padding:6px 10px;font-family:'Noto Serif TC',serif;font-size:13px;color:var(--ink);outline:none;resize:vertical;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}
.field textarea{min-height:66px;line-height:1.6}
.sec{font-size:10px;letter-spacing:.12em;color:var(--red);font-weight:700;margin:1rem 0 .75rem;padding-bottom:4px;border-bottom:.5px solid var(--border)}
.star-input{display:flex;gap:4px;margin-top:4px}
.star-input span{font-size:18px;cursor:pointer;color:#ddd;user-select:none;transition:color .1s}
.star-input span.on{color:var(--red)}
.star-val{font-size:11px;color:var(--ink-light);margin-left:4px}
.dots-row{display:flex;gap:6px;margin-top:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cream-dark);border:.5px solid var(--border);cursor:pointer;transition:background .1s}
.dot.on{background:var(--ink);border-color:var(--ink)}
.img-zone{background:var(--cream-dark);border:1.5px dashed var(--border);border-radius:6px;padding:1rem;text-align:center;cursor:pointer;font-size:12px;color:var(--ink-faint);transition:border-color .15s;position:relative;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.img-zone:hover{border-color:var(--red)}
.img-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-preview{max-width:100%;max-height:160px;border-radius:4px;margin-top:8px;display:none}
.img-clear{font-size:11px;color:var(--red);cursor:pointer;text-decoration:underline;display:none;margin-top:4px}
.cat-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.cat-check{display:flex;align-items:center;gap:5px;cursor:pointer}
.cat-check input{cursor:pointer;accent-color:var(--red)}
.cat-check span{font-size:12px}
.case-list-item{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border:.5px solid var(--border);border-radius:4px;margin-bottom:5px;font-size:12px;background:#f5f0e8;cursor:pointer;transition:background .1s}
.case-list-item:hover{background:var(--cream-dark)}
.case-list-item.editing{border-color:var(--red);background:#fdf0f0}
.item-id{font-family:monospace;font-size:10px;color:var(--ink-light);margin-right:8px}
.item-del{color:var(--red);font-size:11px;cursor:pointer;padding:2px 6px;flex-shrink:0}
.preview-case{background:#fdfaf5;border:.5px solid var(--border);border-radius:10px;overflow:hidden}
.pv-header{background:var(--cream-dark);border-bottom:.5px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.pv-id{font-family:monospace;font-size:11px;color:var(--ink-light)}
.pv-name{font-size:15px;font-weight:700;flex:1}
.pv-tag{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:500}
.tag-modeled{background:#fde8c0;color:#8a4e00;border:.5px solid #d4a040}
.tag-archived{background:#e0ede0;color:#2a5e2a;border:.5px solid #5c9a5c}
.tag-ongoing{background:#fce8e8;color:#8a2020;border:.5px solid #c84040}
.pv-body{padding:1rem 1.25rem}
.pv-row{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;margin-bottom:.6rem;align-items:start}
.pv-label{font-size:11px;color:var(--ink-light);padding-top:2px}
.pv-val{font-size:13px;line-height:1.7;white-space:pre-wrap}
.pv-model{background:var(--cream-dark);border:.5px solid var(--border);border-radius:4px;padding:.5rem .75rem;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--ink-mid)}
.pv-impact{display:flex;gap:1.5rem;flex-wrap:wrap}
.pv-impact-label{font-size:10px;color:var(--ink-light);margin-bottom:2px}
.pv-stars{display:flex;gap:1px}
.pv-star-on{color:var(--red);font-size:13px}
.pv-star-off{color:#ddd;font-size:13px}
.pv-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cream-dark);border:.5px solid var(--border);margin-right:2px}
.pv-dot.on{background:var(--ink);border-color:var(--ink)}
.pv-img{max-width:100%;border-radius:4px;margin-top:6px;display:block;border:.5px solid var(--border)}
.pv-baseline{background:#f0e8dc;border-top:2px solid var(--red);padding:1rem 1.25rem}
.pv-bl-title{font-size:10px;letter-spacing:.12em;color:var(--red);font-weight:700;margin-bottom:.75rem}
.pv-bl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:.75rem}
.pv-bl-cell{font-size:12px;line-height:1.7}
.pv-bl-label{font-size:10px;color:var(--ink-light);margin-bottom:2px}
.pv-bl-footer{display:flex;gap:2rem;flex-wrap:wrap;padding-top:.5rem;border-top:.5px solid var(--border);font-size:12px}
.output-area{font-family:monospace;font-size:11px;background:#1e1a14;color:#d4c89a;border-radius:6px;padding:1rem;white-space:pre;overflow-x:auto;line-height:1.7;min-height:80px}
.btn{display:inline-block;padding:6px 16px;font-family:'Noto Serif TC',serif;font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;border:1px solid;transition:opacity .15s}
.btn:hover{opacity:.8}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ghost{background:transparent;color:var(--red);border-color:var(--red)}
.btn-dark{background:#2a2218;color:#d4c89a;border-color:#2a2218}
.btn-sm{padding:3px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#2a2218;color:#d4c89a;padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.empty-hint{font-size:12px;color:var(--ink-faint);text-align:center;padding:2rem 0}
.cat-mgmt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}
.cat-mgmt-row input{flex:1;padding:4px 8px;font-size:12px;background:#f5f0e8;border:.5px solid var(--border);border-radius:4px;font-family:'Noto Serif TC',serif;color:var(--ink);outline:none}
.cat-mgmt-row input:focus{border-color:var(--red)}
.cat-del{color:var(--red);cursor:pointer;font-size:13px;padding:0 4px;flex-shrink:0}
</style>
</head>
<body>
<div class="page-header">
  <h1>世界觀更新管理局　案例編輯器</h1>
  <span class="sub">WUA CASE EDITOR</span>
</div>
<div class="layout">

  <!-- 左：基本資料 -->
  <div class="panel">
    <div class="panel-header">案例基本資料</div>
    <div class="panel-body">
      <div class="field"><label>案例編號</label><input id="f-id" placeholder="WUA-009"/></div>
      <div class="field"><label>案例名稱</label><input id="f-name" placeholder="案例名稱"/></div>
      <div class="field"><label>狀態標籤</label>
        <select id="f-tag">
          <option value="modeled">建模成功</option>
          <option value="archived">歸檔</option>
          <option value="ongoing">持續監測中</option>
        </select>
      </div>
      <div class="field"><label>首次發現</label><input id="f-date" placeholder="2026-XX-XX"/></div>
      <div class="field"><label>異常分類（可複選）</label><div class="cat-checks" id="cat-checks"></div></div>
      <div class="sec">原始事件</div>
      <div class="field"><label>事件描述</label><textarea id="f-event"></textarea></div>
      <div class="field"><label>截圖</label>
        <div style="display:flex;align-items:center;gap:.75rem;font-size:13px">
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
            <input type="checkbox" id="f-img-none"> 無截圖
          </label>
          <span id="img-path-hint" style="color:var(--ink-faint);font-size:12px">自動抓 img/WUA-XXX.jpg</span>
        </div>
      </div>
      <div class="field"><label>異常現象</label><textarea id="f-anomaly"></textarea></div>
      <div class="sec">建模過程（可留空）</div>
      <div id="model-views-list"></div>
      <div class="btn-row" style="margin-top:.5rem">
        <button class="btn btn-ghost btn-sm" onclick="addModelView()">＋ 新增視角</button>
      </div>
      <div class="field"><label>最終判定</label><input id="f-verdict" placeholder="會計精 📊"/></div>
      <div class="field"><label>備註</label><textarea id="f-note"></textarea></div>
    </div>
  </div>

  <!-- 右：衝擊值＋基準線＋案例管理 -->
  <div class="panel">
    <div class="panel-header">衝擊評估</div>
    <div class="panel-body">
      <div class="field"><label>世界觀衝擊值</label>
        <div class="star-input" id="stars-world">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
      </div>
      <div class="field"><label>研究員衝擊值（可超過5）</label>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="star-input" id="stars-researcher">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span><span data-v="6">★</span><span data-v="7">★</span><span data-v="8">★</span><span data-v="9">★</span><span data-v="10">★</span>
          </div>
          <span class="star-val" id="researcher-val">0</span>
        </div>
      </div>
      <div class="field"><label>重建難度</label>
        <div class="dots-row" id="dots-difficulty">
          <span style="font-size:10px;color:var(--ink-light);cursor:pointer" onclick="setDiff(0)">無</span>
          <span class="dot" data-v="1"></span><span class="dot" data-v="2"></span><span class="dot" data-v="3"></span><span class="dot" data-v="4"></span><span class="dot" data-v="5"></span>
        </div>
      </div>
      <div class="sec">基準線更新紀錄</div>
      <div class="field"><label>更新前認知</label><textarea id="f-before"></textarea></div>
      <div class="field"><label>更新後認知</label><textarea id="f-after"></textarea></div>
      <div class="field"><label>更新幅度</label><input id="f-delta" placeholder="+37%"/></div>
      <div class="field"><label>後遺症</label><textarea id="f-sequel"></textarea></div>
      <div class="sec">案例庫管理</div>
      <div id="case-list"><div class="empty-hint">尚無案例</div></div>
      <div class="btn-row">
        <button class="btn btn-red" onclick="saveCase()">儲存案例</button>
        <button class="btn btn-ghost" onclick="clearForm()">清空表單</button>
      </div>
    </div>
  </div>

  <!-- 標籤管理 -->
  <div class="panel full">
    <div class="panel-header">異常分類標籤管理</div>
    <div class="panel-body">
      <p style="font-size:12px;color:var(--ink-light);margin-bottom:.75rem">新增、修改、刪除分類標籤。修改後會同步到案例編輯器的勾選清單，並一起匯出。</p>
      <div id="cat-mgmt-list"></div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="addCatRow()">＋ 新增標籤</button>
      </div>
    </div>
  </div>

  <!-- 預覽 -->
  <div class="panel full">
    <div class="panel-header">預覽</div>
    <div class="panel-body" id="preview-body"><div class="empty-hint">填寫欄位後即時預覽</div></div>
  </div>

  <!-- 匯入 -->
  <div class="panel full">
    <div class="panel-header">匯入現有 wua-cases.js</div>
    <div class="panel-body">
      <div class="field"><label>上傳檔案</label>
        <div style="display:flex;align-items:center;gap:.5rem">
          <input type="file" id="import-file" accept=".js,.txt" style="font-size:13px;flex:1"/>
          <span id="import-placeholder" style="font-size:12px;color:var(--ink-faint)"></span>
        </div>
      </div>
      <div class="field"><label>或直接貼上內容</label>
        <textarea id="import-text" style="min-height:80px;font-family:monospace;font-size:11px" placeholder="貼上 wua-cases.js 完整內容..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-red" onclick="importCases()">載入案例</button>
        <button class="btn btn-ghost" onclick="clearImport()">清空</button>
      </div>
      <div id="import-status" style="font-size:12px;color:var(--ink-light);margin-top:.5rem"></div>
    </div>
  </div>

  <!-- 匯出 -->
  <div class="panel full">
    <div class="panel-header">匯出 wua-cases.js</div>
    <div class="panel-body">
      <div class="output-area" id="output-area">// 案例庫為空</div>
      <div class="btn-row">
        <button class="btn btn-dark" onclick="copyOutput()">複製全部</button>
        <button class="btn btn-ghost" onclick="downloadJS()">下載 wua-cases.js</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── state ──
let CATEGORIES = {
  accounting:  { label:"會計精系列", icon:"📊", desc:"沉沒成本、投資報酬、折舊計算用於不該用的地方" },
  ghost_arena: { label:"幽靈賽場系列", icon:"🏟️", desc:"單邊建立賽制，對手不知情" },
  sovereignty: { label:"感受主權移轉系列", icon:"👑", desc:"第三方認定當事人的感受比當事人更準確" },
  empire:      { label:"帝制復辟系列", icon:"📋", desc:"用文件或宣言建立單方面統治秩序" },
  baseline:    { label:"基準線校正事件", icon:"📈", desc:"直接命中，無分析空間" },
};
let META = {
  version:"v1.0.8", last_updated:"WUA-007 馬來西亞登機幸福宣言",
  director:"小麻糬", changelog:[{remove:"宣布勝利需要有人承認失敗",add:"部分人類可在對手未參賽的情況下宣布勝利"}]
};
let cases=[], editingIndex=-1, starsWorld=0, starsResearcher=0, difficulty=0;

// ── init ──
buildCatChecks();
buildCatMgmt();
renderModelViews();

// ── category checkboxes ──
function buildCatChecks(){
  const el=document.getElementById('cat-checks'); el.innerHTML='';
  Object.entries(CATEGORIES).forEach(([k,v])=>{
    const lbl=document.createElement('label'); lbl.className='cat-check';
    lbl.innerHTML=`<input type="checkbox" value="${k}" onchange="updatePreview()"><span>${v.icon} ${v.label}</span>`;
    el.appendChild(lbl);
  });
}

// ── category management ──
function buildCatMgmt(){
  const el=document.getElementById('cat-mgmt-list'); el.innerHTML='';
  Object.entries(CATEGORIES).forEach(([k,v])=>{
    const row=document.createElement('div'); row.className='cat-mgmt-row'; row.dataset.key=k;
    row.innerHTML=`
      <input placeholder="key" value="${k}" style="max-width:120px;font-family:monospace" data-field="key">
      <input placeholder="icon" value="${v.icon}" style="max-width:50px;text-align:center" data-field="icon">
      <input placeholder="名稱" value="${v.label}" data-field="label">
      <input placeholder="說明" value="${v.desc}" data-field="desc">
      <span class="cat-del" onclick="delCat('${k}')">✕</span>`;
    row.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>syncCat(row)));
    el.appendChild(row);
  });
}
function syncCat(row){
  const oldKey=row.dataset.key;
  const newKey=row.querySelector('[data-field=key]').value.trim().replace(/\s/g,'_');
  const icon=row.querySelector('[data-field=icon]').value.trim();
  const label=row.querySelector('[data-field=label]').value.trim();
  const desc=row.querySelector('[data-field=desc]').value.trim();
  if(!newKey) return;
  if(newKey!==oldKey){ delete CATEGORIES[oldKey]; row.dataset.key=newKey; }
  CATEGORIES[newKey]={label,icon,desc};
  buildCatChecks();
}
function delCat(k){
  if(!confirm(`刪除分類「${CATEGORIES[k]?.label||k}」？`)) return;
  delete CATEGORIES[k]; buildCatMgmt(); buildCatChecks();
}
function addCatRow(){
  const key='new_cat_'+Date.now();
  CATEGORIES[key]={label:'新分類',icon:'📌',desc:''};
  buildCatMgmt(); buildCatChecks();
  // scroll to new row
  const rows=document.querySelectorAll('.cat-mgmt-row');
  rows[rows.length-1].querySelector('[data-field=key]').focus();
}

// ── stars ──
function initStars(id,setter,max){
  document.querySelectorAll(`#${id} span[data-v]`).forEach(s=>{
    s.addEventListener('click',()=>{
      setter(parseInt(s.dataset.v));
      updateStarsUI(id,parseInt(s.dataset.v));
      if(id==='stars-researcher') document.getElementById('researcher-val').textContent=starsResearcher;
      updatePreview();
    });
  });
}
function updateStarsUI(id,val){
  document.querySelectorAll(`#${id} span[data-v]`).forEach(s=>s.classList.toggle('on',parseInt(s.dataset.v)<=val));
}
initStars('stars-world',v=>starsWorld=v);
initStars('stars-researcher',v=>starsResearcher=v);

// ── difficulty ──
function setDiff(n){ difficulty=n; document.querySelectorAll('#dots-difficulty .dot').forEach(d=>d.classList.toggle('on',parseInt(d.dataset.v)<=n)); updatePreview(); }
document.querySelectorAll('#dots-difficulty .dot').forEach(d=>d.addEventListener('click',()=>setDiff(parseInt(d.dataset.v))));

// ── image ──
function updateImgHint(){
  const id=document.getElementById('f-id').value.trim();
  const noImg=document.getElementById('f-img-none').checked;
  const hint=document.getElementById('img-path-hint');
  if(noImg){ hint.textContent='不顯示截圖'; hint.style.color='var(--ink-faint)'; }
  else if(id){ hint.textContent='將顯示 img/'+id+'.jpg'; hint.style.color='var(--red)'; }
  else{ hint.textContent='自動抓 img/WUA-XXX.jpg'; hint.style.color='var(--ink-faint)'; }
}
document.getElementById('f-img-none').addEventListener('change',()=>{updateImgHint();updatePreview();});
document.getElementById('f-id').addEventListener('input',updateImgHint);

// ── live preview ──
document.querySelectorAll('input:not([type=file]):not([type=checkbox]),textarea,select').forEach(el=>{
  if(!el.closest('#cat-mgmt-list')&&!el.closest('#import-text')) el.addEventListener('input',updatePreview);
});

function g(id){return document.getElementById(id).value.trim()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function selectedCats(){return[...document.querySelectorAll('#cat-checks input:checked')].map(i=>i.value)}
function catBadges(){
  return selectedCats().map(k=>{const c=CATEGORIES[k]; return c?`<span style="font-size:10px;padding:1px 7px;border-radius:10px;background:#f0ebe0;color:var(--ink-light);border:.5px solid var(--border);margin-right:3px">${c.icon} ${c.label}</span>`:''}).join('');
}
function starsHTML(n,max){
  if(!n) return '<span style="color:#ddd;font-size:12px">—</span>';
  let h='<div class="pv-stars">';
  for(let i=1;i<=(max||5);i++) h+=i<=n?'<span class="pv-star-on">★</span>':'<span class="pv-star-off">★</span>';
  if(n>(max||5)) h+=`<span style="font-size:11px;color:var(--red);margin-left:3px">×${n}</span>`;
  return h+'</div>';
}
function dotsHTML(n){let h='';for(let i=1;i<=5;i++) h+=`<span class="pv-dot${i<=n?' on':''}"></span>`;return h}
function tagHTML(tag){
  const m={modeled:['tag-modeled','建模成功'],archived:['tag-archived','歸檔'],ongoing:['tag-ongoing','持續監測中']};
  const[c,l]=m[tag]||m.modeled; return`<span class="pv-tag ${c}">${l}</span>`;
}

function updatePreview(){
  const id=g('f-id'),name=g('f-name');
  if(!id&&!name){document.getElementById('preview-body').innerHTML='<div class="empty-hint">填寫欄位後即時預覽</div>';return}
  const imgPart=imgBase64?`<img src="${imgBase64}" class="pv-img" alt="截圖">`:'';
  const modelViews = getModelViews().filter(v=>v.content.trim());
  let modelPart = '';
  if (modelViews.length === 1) {
    modelPart = `<div class="pv-row"><span class="pv-label">${esc(modelViews[0].title||'建模過程')}</span><div class="pv-model">${esc(modelViews[0].content)}</div></div>`;
  } else if (modelViews.length > 1) {
    const tabs = modelViews.map(v=>`<div style="margin-bottom:6px"><div style="font-size:10px;letter-spacing:.08em;color:var(--red);font-weight:700;margin-bottom:3px">${esc(v.title)}</div><div class="pv-model">${esc(v.content)}</div></div>`).join('');
    modelPart = `<div class="pv-row"><span class="pv-label">建模過程</span><div style="width:100%">${tabs}</div></div>`;
  };
  const notePart=g('f-note')?`<div class="pv-row"><span class="pv-label">備註</span><span class="pv-val">${esc(g('f-note'))}</span></div>`:'';
  document.getElementById('preview-body').innerHTML=`
<div class="preview-case">
  <div class="pv-header"><span class="pv-id">${esc(id)}</span><span class="pv-name">${esc(name)}</span>${catBadges()}${tagHTML(g('f-tag')||'modeled')}</div>
  <div class="pv-body">
    <div class="pv-row"><span class="pv-label">首次發現</span><span class="pv-val">${esc(g('f-date'))}</span></div>
    <div class="pv-row"><span class="pv-label">原始事件</span><div><span class="pv-val">${esc(g('f-event'))}</span>${imgPart}</div></div>
    <div class="pv-row"><span class="pv-label">異常現象</span><span class="pv-val">${esc(g('f-anomaly'))}</span></div>
    ${modelPart}
    <div class="pv-row"><span class="pv-label">最終判定</span><span class="pv-val"><strong>${esc(g('f-verdict'))}</strong></span></div>
    <div class="pv-row"><span class="pv-label">衝擊評估</span>
      <div class="pv-impact">
        <div><div class="pv-impact-label">世界觀衝擊值</div>${starsHTML(starsWorld,5)}</div>
        <div><div class="pv-impact-label">研究員衝擊值</div>${starsHTML(starsResearcher,starsResearcher>5?10:5)}</div>
        ${difficulty>0?`<div><div class="pv-impact-label">重建難度</div>${dotsHTML(difficulty)}</div>`:''}
      </div>
    </div>
    ${notePart}
  </div>
  <div class="pv-baseline">
    <div class="pv-bl-title">基準線更新紀錄　BASELINE UPDATE LOG</div>
    <div class="pv-bl-grid">
      <div class="pv-bl-cell"><div class="pv-bl-label">更新前認知</div><div>${esc(g('f-before'))}</div></div>
      <div class="pv-bl-cell"><div class="pv-bl-label">更新後認知</div><div>${esc(g('f-after'))}</div></div>
    </div>
    <div class="pv-bl-footer">
      <div><span style="color:var(--ink-light)">更新幅度　</span><span style="color:var(--red);font-weight:700">${esc(g('f-delta'))}</span></div>
      <div><span style="color:var(--ink-light)">後遺症　</span><span style="font-style:italic;color:var(--ink-mid)">${esc(g('f-sequel'))}</span></div>
    </div>
  </div>
</div>`;
}

// ── save / load ──
function getForm(){
  return{
    id:g('f-id'),name:g('f-name'),tag:document.getElementById('f-tag').value,
    date:g('f-date'),category:selectedCats(),
    event_text:g('f-event'),event_img:document.getElementById('f-img-none').checked?null:true,
    anomaly:g('f-anomaly'),model:getModelViews(),verdict:g('f-verdict'),
    impact_world:starsWorld,impact_researcher:starsResearcher,rebuild_difficulty:difficulty,
    note:g('f-note'),before:g('f-before'),after:g('f-after'),delta:g('f-delta'),sequel:g('f-sequel'),
  };
}
function saveCase(){
  const c=getForm();
  if(!c.id||!c.name){showToast('請填寫案例編號與名稱');return}
  if(editingIndex>=0){cases[editingIndex]=c;}
  else{cases.push(c);}
  renderCaseList(); renderOutput();
  showToast(editingIndex>=0?'已儲存修改':'案例已加入');
  editingIndex=-1;
  // keep form open for continued editing, just update list highlight
  renderCaseList();
}
function renderCaseList(){
  const el=document.getElementById('case-list');
  if(!cases.length){el.innerHTML='<div class="empty-hint">尚無案例</div>';return}
  el.innerHTML=cases.map((c,i)=>`
    <div class="case-list-item${editingIndex===i?' editing':''}" onclick="loadCase(${i})">
      <span><span class="item-id">${c.id}</span>${c.name}</span>
      <span class="item-del" onclick="delCase(event,${i})">刪除</span>
    </div>`).join('');
}
function loadCase(i){
  const c=cases[i]; editingIndex=i;
  document.getElementById('f-id').value=c.id;
  document.getElementById('f-name').value=c.name;
  document.getElementById('f-tag').value=c.tag||'modeled';
  document.getElementById('f-date').value=c.date||'';
  document.getElementById('f-event').value=c.event_text||'';
  document.getElementById('f-anomaly').value=c.anomaly||'';
  // load model views
  modelViewsData = [];
  if (Array.isArray(c.model) && c.model.length > 0) {
    modelViewsData = c.model.map(v=>({title:v.title||'',content:v.content||''}));
  } else if (typeof c.model === 'string' && c.model.trim()) {
    modelViewsData = [{title:'建模過程', content:c.model}];
  }
  renderModelViews();
  document.getElementById('f-verdict').value=c.verdict||'';
  document.getElementById('f-note').value=c.note||'';
  document.getElementById('f-before').value=c.before||'';
  document.getElementById('f-after').value=c.after||'';
  document.getElementById('f-delta').value=c.delta||'';
  document.getElementById('f-sequel').value=c.sequel||'';
  starsWorld=c.impact_world||0; updateStarsUI('stars-world',starsWorld);
  starsResearcher=c.impact_researcher||0; updateStarsUI('stars-researcher',starsResearcher);
  document.getElementById('researcher-val').textContent=starsResearcher;
  setDiff(c.rebuild_difficulty||0);
  document.querySelectorAll('#cat-checks input').forEach(inp=>inp.checked=(c.category||[]).includes(inp.value));
  document.getElementById('f-img-none').checked=!c.event_img;
  updateImgHint();
  renderCaseList(); updatePreview();
  window.scrollTo({top:0,behavior:'smooth'});
}
function delCase(e,i){
  e.stopPropagation(); cases.splice(i,1);
  if(editingIndex===i){editingIndex=-1;clearForm();}
  renderCaseList(); renderOutput();
}
function clearForm(){
  ['f-id','f-name','f-date','f-event','f-anomaly','f-verdict','f-note','f-before','f-after','f-delta','f-sequel'].forEach(id=>document.getElementById(id).value='');
  modelViewsData=[]; renderModelViews();
  document.getElementById('f-tag').value='modeled';
  starsWorld=0; starsResearcher=0; setDiff(0);
  updateStarsUI('stars-world',0); updateStarsUI('stars-researcher',0);
  document.getElementById('researcher-val').textContent='0';
  document.querySelectorAll('#cat-checks input').forEach(i=>i.checked=false);
  document.getElementById('f-img-none').checked=false;
  updateImgHint();
  editingIndex=-1; renderCaseList(); updatePreview();
}

// ── output ──
function jsStr(s){if(s===null||s===undefined) return'null'; return JSON.stringify(String(s))}
function renderOutput(){
  if(!cases.length){document.getElementById('output-area').textContent='// 案例庫為空';return}
  const lines=[];
  cases.forEach((c,i)=>{
    lines.push('  {');
    lines.push(`    id: ${jsStr(c.id)},`);
    lines.push(`    name: ${jsStr(c.name)},`);
    lines.push(`    category: [${(c.category||[]).map(x=>jsStr(x)).join(', ')}],`);
    lines.push(`    tag: ${jsStr(c.tag)},`);
    lines.push(`    date: ${jsStr(c.date)},`);
    lines.push(`    event_text: ${jsStr(c.event_text)},`);
    lines.push(`    event_img: ${c.event_img?jsStr('img/'+c.id+'.jpg'):'null'},`);
    lines.push(`    anomaly: ${jsStr(c.anomaly)},`);
    // model: array
    if (Array.isArray(c.model) && c.model.length > 0) {
      const filtered = c.model.filter(v=>v.content&&v.content.trim());
      if (filtered.length > 0) {
        lines.push('    model: ' + JSON.stringify(filtered) + ',');
      } else { lines.push('    model: [],'); }
    } else { lines.push('    model: [],'); }
    lines.push(`    verdict: ${jsStr(c.verdict)},`);
    lines.push(`    impact_world: ${c.impact_world||0},`);
    lines.push(`    impact_researcher: ${c.impact_researcher||0},`);
    lines.push(`    rebuild_difficulty: ${c.rebuild_difficulty||0},`);
    lines.push(`    note: ${jsStr(c.note)},`);
    lines.push(`    before: ${jsStr(c.before)},`);
    lines.push(`    after: ${jsStr(c.after)},`);
    lines.push(`    delta: ${jsStr(c.delta)},`);
    lines.push(`    sequel: ${jsStr(c.sequel)},`);
    lines.push(i<cases.length-1?'  },':'  }');
  });
  document.getElementById('output-area').textContent=lines.join('\n');
}
function buildFullJS(){
  const casesText=document.getElementById('output-area').textContent;
  const catsLines=['var WUA_CATEGORIES = {'];
  Object.entries(CATEGORIES).forEach(([k,v],i,arr)=>{
    const comma=i<arr.length-1?',':'';
    catsLines.push(`  ${k}: { label: ${jsStr(v.label)}, icon: ${jsStr(v.icon)}, desc: ${jsStr(v.desc)} }${comma}`);
  });
  catsLines.push('};');
  const lastCase=cases[cases.length-1];
  const metaObj={...META, last_updated: lastCase?lastCase.id+' '+lastCase.name:META.last_updated};
  const metaLines=[
    'var WUA_META = {',
    `  version: ${jsStr(metaObj.version)},`,
    `  last_updated: ${jsStr(metaObj.last_updated)},`,
    `  director: ${jsStr(metaObj.director)},`,
    `  changelog: [{ remove: ${jsStr(metaObj.changelog[0]?.remove||'')}, add: ${jsStr(metaObj.changelog[0]?.add||'')} }]`,
    '};'
  ];
  return `var WUA_CASES = [\n${casesText}\n];\n\n${catsLines.join('\n')}\n\n${metaLines.join('\n')}`;
}
function copyOutput(){
  navigator.clipboard.writeText(buildFullJS()).then(()=>showToast('已複製完整 JS'));
}
function downloadJS(){
  if(!cases.length){showToast('案例庫為空');return}
  const blob=new Blob([buildFullJS()],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='wua-cases.js'; a.click();
}

// ── import ──
document.getElementById('import-file').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=ev=>{
    document.getElementById('import-text').value=ev.target.result;
    document.getElementById('import-placeholder').textContent='✅ '+file.name+' 已讀取';
  }; r.readAsText(file);
});
function importCases(){
  const text=document.getElementById('import-text').value.trim();
  if(!text){showToast('請先上傳或貼上內容');return}
  try{
    const fn=new Function(text+'\nreturn {c:typeof WUA_CASES!=="undefined"?WUA_CASES:null,cat:typeof WUA_CATEGORIES!=="undefined"?WUA_CATEGORIES:null,meta:typeof WUA_META!=="undefined"?WUA_META:null}');
    const res=fn();
    if(!res.c||!Array.isArray(res.c)){document.getElementById('import-status').textContent='❌ 找不到 WUA_CASES 陣列';return}
    cases=res.c.map(c=>({
      id:c.id||'',name:c.name||'',category:Array.isArray(c.category)?c.category:[],
      tag:c.tag||'modeled',date:c.date||'',
      event_text:c.event_text||c.event||'',event_img:c.event_img||null,
      anomaly:c.anomaly||'',model:Array.isArray(c.model)?c.model:(c.model?[{title:'建模過程',content:c.model}]:[]),verdict:c.verdict||'',
      impact_world:c.impact_world||0,impact_researcher:c.impact_researcher||0,rebuild_difficulty:c.rebuild_difficulty||0,
      note:c.note||'',before:c.before||'',after:c.after||'',delta:c.delta||'',sequel:c.sequel||'',
    }));
    if(res.cat) CATEGORIES={...res.cat};
    if(res.meta) META={...META,...res.meta};
    buildCatChecks(); buildCatMgmt();
    renderCaseList(); renderOutput();
    document.getElementById('import-status').textContent=`✅ 成功載入 ${cases.length} 件案例`;
    showToast(`載入 ${cases.length} 件案例`);
  } catch(e){document.getElementById('import-status').textContent='❌ 解析失敗：'+e.message}
}
function clearImport(){
  document.getElementById('import-text').value='';
  document.getElementById('import-file').value='';
  document.getElementById('import-placeholder').textContent='';
  document.getElementById('import-status').textContent='';
}

// ── model views ──
let modelViewsData = [];

function addModelView(title, content) {
  modelViewsData.push({title: title||'', content: content||''});
  renderModelViews();
}

function getModelViews() {
  // 從 DOM 重新抓最新值
  const rows = document.querySelectorAll('.model-view-row');
  return Array.from(rows).map(row => ({
    title: row.querySelector('.mv-title').value.trim(),
    content: row.querySelector('.mv-content').value.trim(),
  }));
}

function renderModelViews() {
  const el = document.getElementById('model-views-list');
  if (!el) return;
  if (!modelViewsData.length) {
    el.innerHTML = '<div style="font-size:11px;color:var(--ink-faint);padding:4px 0">無視角，點下方按鈕新增</div>';
    return;
  }
  el.innerHTML = modelViewsData.map((v,i) => `
    <div class="model-view-row" style="background:var(--cream-dark);border:.5px solid var(--border);border-radius:6px;padding:.6rem .75rem;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <input class="mv-title" value="${v.title.replace(/"/g,'&quot;')}" placeholder="視角標題（如：原告視角）" style="flex:1;background:#f5f0e8;border:.5px solid var(--border);border-radius:3px;padding:3px 7px;font-family:inherit;font-size:11px;color:var(--ink);outline:none" oninput="syncModelView(${i},this,'title')">
        <span style="color:var(--red);cursor:pointer;font-size:13px;padding:0 4px" onclick="delModelView(${i})">✕</span>
      </div>
      <textarea class="mv-content" placeholder="視角內容..." style="width:100%;min-height:80px;background:#f5f0e8;border:.5px solid var(--border);border-radius:3px;padding:5px 8px;font-family:inherit;font-size:12px;color:var(--ink);outline:none;resize:vertical;line-height:1.6" oninput="syncModelView(${i},this,'content')">${v.content.replace(/</g,'&lt;')}</textarea>
    </div>`).join('');
  updatePreview();
}

function syncModelView(i, el, field) {
  if (modelViewsData[i]) modelViewsData[i][field] = el.value;
  updatePreview();
}

function delModelView(i) {
  modelViewsData.splice(i,1);
  renderModelViews();
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
